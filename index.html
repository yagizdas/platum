<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f5f1">
  <meta name="description" content="Your lunch, sorted. Mensa Plate at Arcisstraße.">
  <title>Mensa Plate</title>
  <link rel="icon" type="image/webp" href="./icons/ui/tray.webp">
  <link rel="apple-touch-icon" href="./icons/ui/app-180.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="preload" href="./assets/fonts/bricolage-grotesque-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="./icons/ui/tray.webp" as="image" fetchpriority="high">
  <link rel="stylesheet" href="./icons/artwork.css">
  <link rel="stylesheet" href="./landing.css">
  <script src="./dish-icons.js" defer></script>
  <script src="./landing.js" defer></script>
</head>
<body>
  <main>
    <section class="hero" aria-labelledby="hero-title">
      <div class="hero-copy">
        <h1 id="hero-title">Mensa<br>Plate</h1>
        <p>Your lunch, sorted.</p>
        <a class="cta" href="#goals">Your plate <span aria-hidden="true">↗</span></a>
      </div>
      <div class="hero-art">
        <div class="hero-float">
          <span class="artwork art-tray" data-icon="tray"><img src="./icons/ui/tray.webp" width="1254" height="1254" alt="Illustrated canteen tray" decoding="async"></span>
        </div>
      </div>
    </section>

    <section class="goals-section section" id="goals" aria-labelledby="goals-title">
      <h2 class="section-title reveal" id="goals-title">Goal selector</h2>
      <div class="goal-grid" role="group" aria-label="Lunch goal">
        <button class="goal-card reveal" type="button" data-goal="bulk" aria-pressed="true">
          <span class="selected-mark" aria-hidden="true">↗</span>
          <span class="artwork art-dumbbell" data-icon="dumbbell"><img src="./icons/ui/dumbbell.webp" width="640" height="640" alt="" decoding="async"></span>
          <span>Bulk</span>
        </button>
        <button class="goal-card reveal" type="button" data-goal="cut" aria-pressed="false">
          <span class="selected-mark" aria-hidden="true">↗</span>
          <span class="artwork art-tape" data-icon="tape"><img src="./icons/ui/tape.webp" width="640" height="640" alt="" decoding="async"></span>
          <span>Cut</span>
        </button>
        <button class="goal-card reveal" type="button" data-goal="budget" aria-pressed="false">
          <span class="selected-mark" aria-hidden="true">↗</span>
          <span class="artwork art-coins" data-icon="coins"><img src="./icons/ui/coins.webp" width="640" height="640" alt="" decoding="async"></span>
          <span>Budget</span>
        </button>
        <button class="goal-card reveal" type="button" data-goal="vegan" aria-pressed="false">
          <span class="selected-mark" aria-hidden="true">↗</span>
          <span class="artwork art-leaf" data-icon="leaf"><img src="./icons/ui/leaf.webp" width="640" height="640" alt="" decoding="async"></span>
          <span>Vegan</span>
        </button>
      </div>
    </section>

    <section class="pick-section section" id="pick" aria-labelledby="pick-title">
      <h2 class="section-title reveal" id="pick-title">Today's pick</h2>
      <a class="pick-card reveal" id="pick-link" href="./menu.html?goal=bulk" aria-busy="true">
        <div class="pick-art dish-scene"><span id="pick-illustration" class="artwork art-tray" data-icon="tray"><img src="./icons/ui/tray.webp" width="1254" height="1254" alt="" decoding="async"></span></div>
        <div class="pick-content">
          <h3 id="plate-name">Your plate</h3>
          <p class="pick-side" id="pick-side" lang="de" hidden></p>
          <p class="pick-price" id="plate-price" hidden></p>
          <dl class="macros" id="macros" aria-label="Estimated macros in grams" hidden>
            <div><dt class="sr-only">Protein</dt><dd id="protein"></dd></div>
            <div><dt class="sr-only">Carbohydrates</dt><dd id="carbs"></dd></div>
            <div><dt class="sr-only">Fat</dt><dd id="fat"></dd></div>
          </dl>
        </div>
      </a>
      <p class="sr-only" id="announcement" aria-live="polite" aria-atomic="true"></p>
    </section>
  </main>
</body>
</html>
