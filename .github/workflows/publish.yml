name: Publish current site

on:
  workflow_dispatch:

# Share the deployment lock with the daily pipeline.
concurrency:
  group: mensa-daily-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/configure-pages@v5
      - name: Package the current committed site
        run: |
          mkdir -p dist/data
          cp index.html dist/index.html
          cp data/today.json dist/data/today.json
          touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
