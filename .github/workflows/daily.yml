name: Refresh menus and publish

on:
  schedule:
    - cron: '30 6 * * 1-5' # Refresh current Garching recipes each weekday before lunch
    - cron: '30 7 * * 6,0' # Saturday batch; Sunday skips completed batches or retries failures
  workflow_dispatch:

concurrency:
  group: mensa-daily-pages
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: read
    outputs:
      artifact_uploaded: ${{ steps.artifact.outcome }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: node --test tests/*.cjs
      - name: Refresh current Garching menus or prepare the weekend batch
        id: batch
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [[ "${{ github.event.schedule }}" == '30 6 * * 1-5' ]]; then
            python weekly_batch.py --campus garching --current-week --refresh
          else
            python weekly_batch.py
          fi
      - name: Persist data and successful tags (also after a later failure)
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "Update campus menus and dish cache [skip ci]"
            git push origin HEAD:${{ github.event.repository.default_branch }}
          fi
      - uses: actions/configure-pages@v5
        if: always()
      - name: Check out staging site
        if: always()
        uses: actions/checkout@v6
        with:
          ref: staging
          path: staging-source
      - name: Rescore cached proposals with staging code
        if: always()
        run: |
          cp data/{dish_cache.json,pairing_cache.json} staging-source/data/
          cp -R data/{menus,proposals} staging-source/data/
          cp data/week.json staging-source/data/week.json
          if [[ -d data/campuses ]]; then
            mkdir -p staging-source/data/campuses
            cp -R data/campuses/. staging-source/data/campuses/
          fi
          (cd staging-source && python rescore_cached.py)
      - name: Package only public static files
        id: package
        if: always()
        run: |
          package_site() {
            source=$1
            destination=$2
            mkdir -p "$destination/data" "$destination/icons"
            cp "$source/index.html" "$destination/index.html"
            static_files=(menu.html menu.css landing.css landing.js dish-icons.js menu-days.js report-config.js report-client.js campus-config.js font-trial.js pwa-install.css pwa-install.js service-worker.js)
            for file in "${static_files[@]}"; do
              if [[ -f "$source/$file" ]]; then
                cp "$source/$file" "$destination/$file"
              fi
            done
            cp -R "$source/assets" "$destination/assets"
            cp "$source/manifest.webmanifest" "$destination/manifest.webmanifest"
            cp "$source/icons/artwork.css" "$destination/icons/artwork.css"
            cp -R "$source/icons/ui" "$destination/icons/ui"
            cp "$source/data/today.json" "$destination/data/today.json"
            cp "$source/data/week.json" "$destination/data/week.json"
            cp -R "$source/data/days" "$destination/data/days"
            for campus in garching; do
              if [[ -f "$source/data/campuses/$campus/week.json" ]]; then
                mkdir -p "$destination/data/campuses/$campus"
                cp "$source/data/campuses/$campus/"{week,today}.json "$destination/data/campuses/$campus/"
                cp -R "$source/data/campuses/$campus/days" "$destination/data/campuses/$campus/days"
              fi
            done
          }

          package_site . dist
          package_site staging-source dist/staging
          cp -R staging-source/label dist/staging/label
          touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        id: artifact
        if: always() && steps.package.outcome == 'success'
        with:
          path: dist
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Surface generation failures after packaging
        if: always() && steps.batch.outcome == 'failure'
        run: exit 1

  deploy:
    needs: generate
    if: always() && needs.generate.outputs.artifact_uploaded == 'success'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      actions: read
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Wait for Pages artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          for attempt in {1..12}; do
            count=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" --jq '[.artifacts[] | select(.name == env.PAGES_ARTIFACT_NAME and .expired == false)] | length')
            if [[ "$count" == '1' ]]; then
              exit 0
            fi
            sleep 5
          done
          echo '::error::Pages artifact metadata did not become available.'
          exit 1
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4.0.0 # Uses the REST artifact lookup verified by the readiness gate.
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
