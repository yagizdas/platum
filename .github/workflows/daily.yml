name: Daily menu and GitHub Pages

on:
  push:
    branches:
      - main
      - staging
  schedule:
    - cron: '30 7 * * 1-5' # 07:30 UTC, Monday–Friday (08:30/09:30 Munich)
  workflow_dispatch:

concurrency:
  group: mensa-daily-pages
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: read
    outputs:
      artifact_uploaded: ${{ steps.artifact.outcome }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: node --test tests/*.cjs
      - run: python scrape.py --week
        id: scrape
        continue-on-error: true
      - name: Tag new dishes with Gemini 3.8 Flash
        id: tag
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python tag.py --week
      - name: Cache lunch pairing knowledge
        id: pair
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python pair.py --week
      - name: Propose lunches and score plates
        id: pick
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python pick.py --week
      - name: Persist data and successful tags (also after a later failure)
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "Update Arcisstraße menu and dish cache [skip ci]"
            git push origin HEAD:${{ github.event.repository.default_branch }}
          fi
      - uses: actions/configure-pages@v5
        if: always()
      - name: Check out staging site
        if: always()
        uses: actions/checkout@v6
        with:
          ref: staging
          path: staging-source
      - name: Rescore cached proposals with staging code
        if: always()
        run: |
          cp data/{dish_cache.json,pairing_cache.json} staging-source/data/
          cp -R data/{menus,proposals} staging-source/data/
          (cd staging-source && python pick.py --week --no-llm)
      - name: Package only public static files
        id: package
        if: always()
        run: |
          package_site() {
            source=$1
            destination=$2
            mkdir -p "$destination/data" "$destination/icons"
            cp "$source/index.html" "$destination/index.html"
            cp "$source"/{menu.html,menu.css,landing.css,landing.js,dish-icons.js,menu-days.js,report-config.js,report-client.js} "$destination/"
            cp -R "$source/assets" "$destination/assets"
            cp "$source/manifest.webmanifest" "$destination/manifest.webmanifest"
            cp "$source/icons/artwork.css" "$destination/icons/artwork.css"
            cp -R "$source/icons/ui" "$destination/icons/ui"
            cp "$source/data/today.json" "$destination/data/today.json"
            cp "$source/data/week.json" "$destination/data/week.json"
            cp -R "$source/data/days" "$destination/data/days"
          }

          package_site . dist
          package_site staging-source dist/staging
          cp -R staging-source/label dist/staging/label
          touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        id: artifact
        if: always() && steps.package.outcome == 'success'
        with:
          path: dist
      - name: Surface generation failures after packaging
        if: always() && (steps.scrape.outcome == 'failure' || steps.tag.outcome == 'failure' || steps.pair.outcome == 'failure' || steps.pick.outcome == 'failure')
        run: exit 1

  deploy:
    needs: generate
    if: always() && needs.generate.outputs.artifact_uploaded == 'success'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
