timezone: Europe/Berlin
official_url: https://www.studierendenwerk-muenchen-oberbayern.de/gastronomie/speiseplan/speiseplan_421_-de.html
eat_api_url: https://tum-dev.github.io/eat-api/mensa-arcisstr/{year}/{week:02d}.json
gemini_model: gemini-3.8-flash
llm:
  enabled: true
proposals:
  instructions:
    bulk: Filling, calorie-dense, high-protein trays.
    cut: High-protein, lighter trays, little fried food or heavy sauce.
    budget: Cheap but still a real, filling lunch.
pairing:
  min_score: 2
standing_sides:
  - name: Reis
    name_en: Rice
    station: Beilagen
    is_vegan: true
  - name: Kartoffelsalat
    name_en: Potato salad
    station: Beilagen
    is_vegan: false

prices:
  default_per_100g: 0.90
  station_per_100g:
    Studitopf: 0.33
  meat_base: 1.00
  fish_base: 1.50
  flat_by_station:
    Pizza: 5.00
  meat_markers: [R, S, G, K, L, W]
  meat_name_pattern: '(?i)fleisch|wurst|würst|krainer|schnitzel|hähnchen|hühn|pute|schwein|rind|lamm|speck|schinken|salami'
  fish_name_pattern: '(?i)fisch|lachs|kabeljau|forelle|thunfisch|zander|seelachs'

portions:
  default_scoop_g: 150
  station_scoop_g: {}  # e.g. {Studitopf: 150, Dessert (Glas): 100}
  max_scoop_g_by_role: {main: 450, side: 300}

scoring:
  bulk:
    learned_model: data/models/bulk-score.json
  cut:
    price: {metric: price, weight: -1, normalizer: 4}
    price_over_budget: {quantity: price, pivot: 7, reverse: true, up: 0, down: 1, normalizer: 1}
    protein_density: {metric: protein_per_100kcal, weight: 2, normalizer: 8}
    protein_value: {metric: protein_per_euro, weight: 0.5, normalizer: 12}
    protein: {quantity: protein, pivot: 30, up: 0.5, down: 3, normalizer: 15}
    energy: {quantity: kcal, pivot: 700, reverse: true, up: 0, down: 2, normalizer: 200}
  budget:
    price: {metric: price, weight: -2, normalizer: 4}
    price_over_budget: {quantity: price, pivot: 7, reverse: true, up: 0, down: 1, normalizer: 1}
    energy_value: {metric: kcal_per_euro, weight: 1, normalizer: 250}
    energy: {quantity: kcal, pivot: 550, up: 0.2, down: 3, normalizer: 300}
    protein: {quantity: protein, pivot: 20, up: 0.2, down: 3, normalizer: 15}
