<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f5f1">
  <meta name="description" content="A lunch plate for your goal at Mensa Arcisstraße. Student prices, simple scoops, and estimated nutrition.">
  <title>Mensa Plate — Arcisstraße</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/webp" href="./icons/ui/tray.webp">
  <link rel="apple-touch-icon" href="./icons/ui/app-180.png">
  <link rel="preload" href="./assets/fonts/bricolage-grotesque-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="./icons/artwork.css">
  <link rel="stylesheet" href="./menu.css?v=live-food-motion-1">
</head>
<body>
  <div class="shell">
    <header>
      <a class="brand" href="./">Mensa Plate<span aria-hidden="true">.</span></a>
      <span class="location">Arcisstraße</span>
      <div id="menu-view-switch" class="menu-view-switch" role="group" aria-label="Staging menu design" hidden></div>
    </header>
    <main>
      <div class="heading">
        <h1><time id="date">Your plate</time></h1>
        <div class="heading-actions">
          <div id="days" class="day-strip" role="group" aria-label="Menu day" hidden></div>
        </div>
      </div>
      <div class="controls">
        <div class="goals" role="group" aria-label="Lunch goal">
          <button type="button" data-goal="bulk" aria-pressed="true"><span class="artwork art-dumbbell" data-icon="dumbbell"><img src="./icons/ui/dumbbell.webp" width="640" height="640" alt="" decoding="async"></span><span>Bulk</span><span class="goal-check" aria-hidden="true"></span></button>
          <button type="button" data-goal="cut" aria-pressed="false"><span class="artwork art-tape" data-icon="tape"><img src="./icons/ui/tape.webp" width="640" height="640" alt="" decoding="async"></span><span>Cut</span><span class="goal-check" aria-hidden="true"></span></button>
          <button type="button" data-goal="budget" aria-pressed="false"><span class="artwork art-coins" data-icon="coins"><img src="./icons/ui/coins.webp" width="640" height="640" alt="" decoding="async"></span><span>Budget</span><span class="goal-check" aria-hidden="true"></span></button>
        </div>
        <div class="filter-control diet-control">
          <button id="filter-toggle" class="diet-tile vegan-face" type="button" aria-expanded="false" aria-controls="filter-panel" aria-label="Diet">
            <span class="artwork art-leaf" data-icon="leaf"><img src="./icons/ui/leaf.webp" width="640" height="640" alt="" decoding="async"></span>
            <span class="diet-copy"><span>Diet</span><span id="diet-summary" class="diet-summary" hidden></span></span>
          </button>
          <section id="filter-panel" class="filter-panel" aria-label="Dietary filters" hidden>
            <h2>Dietary filters</h2>
            <label><input id="vegan" type="checkbox">Vegan</label>
            <label><input id="no-meat" type="checkbox">Vegetarian</label>
            <label><input id="no-pork" type="checkbox">No pork</label>
            <label><input id="no-beef" type="checkbox">No beef</label>
            <button id="clear-filters" class="text-button" type="button">Clear filters</button>
          </section>
        </div>
      </div>
      <section class="receipt" aria-labelledby="plate-title" aria-busy="true" id="plate">
        <div class="tray-tints" aria-hidden="true"><span data-tint="bulk"></span><span data-tint="cut"></span><span data-tint="budget"></span></div>
        <div class="plate-overview">
          <div class="plate-art dish-scene" id="plate-art"><span id="plate-illustration" class="artwork art-tray" data-icon="tray"><img src="./icons/ui/tray.webp" width="1254" height="1254" alt="" decoding="async"></span></div>
          <div class="plate-summary">
            <h2 id="plate-title">Your plate</h2>
            <p class="plate-counter" id="plate-counter" hidden></p>
            <p class="plate-side" id="plate-side" hidden></p>
            <div class="totals" id="totals" hidden>
              <div><span id="price" class="total-value total-price"></span><span class="total-label">Student price</span><span id="includes-extras" class="total-label" hidden>incl. extras</span></div>
              <div><span id="kcal" class="total-value"></span><span class="total-label">kcal</span></div>
              <div><span id="protein" class="total-value"></span><span class="total-label">g protein</span></div>
            </div>
            <p class="details relaxed-note" id="relaxed-note" hidden></p>
            <div class="empty" id="empty" hidden><h3 id="empty-title"></h3><p id="empty-text"></p></div>
          </div>
        </div>
        <div class="plate-actions" id="plate-actions" hidden>
          <div class="alternatives" id="alternatives">
            <button class="arrow" id="previous" type="button" aria-label="Previous lunch">←</button>
            <div id="option-status" class="pager-dots" role="group" aria-label="Lunch options"></div>
            <button class="arrow" id="next" type="button" aria-label="Next lunch">→</button>
          </div>
          <button class="text-button" id="share" type="button">Share plate <span aria-hidden="true">↗</span></button>
        </div>
        <button class="text-button report-button" id="report-plate" type="button" aria-haspopup="dialog" aria-controls="report-sheet" hidden>Can't get this plate?</button>
      </section>
      <dialog id="report-sheet" class="report-sheet" aria-labelledby="report-title">
        <h2 id="report-title">Which dish was at another counter?</h2>
        <div id="report-dishes" class="report-dishes"></div>
        <p id="report-error" class="details" role="status"></p>
        <button class="text-button" id="report-close" type="button">Cancel</button>
      </dialog>
      <div class="secondary-actions" id="secondary-actions" hidden>
        <section class="ingredient-panel" id="plate-details" aria-labelledby="ingredients-title">
          <h2 class="ingredients-title" id="ingredients-title">Details</h2>
          <div class="ingredient-content">
            <ul class="items" id="items"></ul>
          </div>
        </section>
        <details class="disclosure" id="extras-wrap">
          <summary id="extras-title">Add to tray<span class="disclosure-mark" aria-hidden="true">+</span></summary>
          <div class="disclosure-content"><div class="extra-chips" id="extras" role="group" aria-label="Optional soup and dessert"></div></div>
        </details>
      </div>
      <p id="announcement" class="sr-only" aria-live="polite" aria-atomic="true"></p>
      <p id="notice" class="notice" role="status"></p>
      <noscript><p>Enable JavaScript to choose a plate, or visit the official menu below.</p></noscript>
    </main>
    <footer>
      <p>Nutrition values are estimates.</p>
      <a href="https://www.studierendenwerk-muenchen-oberbayern.de/gastronomie/speiseplan/speiseplan_421_-de.html" target="_blank" rel="noopener noreferrer">Official menu ↗</a>
    </footer>
  </div>
  <script src="./dish-icons.js"></script>
  <script src="./menu-days.js"></script>
  <script src="./report-config.js"></script>
  <script src="./report-client.js"></script>
  <script>
    'use strict';
    const $ = id => document.getElementById(id);
    const goals = ['bulk','cut','budget'];
    const titles = {bulk:'Bulk',cut:'Cut',budget:'Budget'};
    const dietLabels = {fish:'Fish',meat:'Meat',vegetarian:'Veg',vegan:'Vegan'};
    const SITE_URL = 'https://yagizdas.github.io/platum/';
    const STAGING_MENU_URL = new URL('staging/menu.html', SITE_URL);
    const MENU_VIEWS = [
      {id:'classic', label:'Classic'},
      {id:'new', label:'New'},
    ];
    let menuView = MENU_VIEWS[0];
    let selection = {goal:'bulk',vegan:false,noPork:false,noBeef:false,noMeat:false};
    let data, stale=false, plateIndex=0, selectedExtras=new Set(), shareTimer;
    let weekIndex, selectedDate, loadToken=0;
    const reports=PlateReports.create(globalThis.MENSA_REPORT_ENDPOINT);
    let brokenKeys=new Set();
    const reducedMotion=matchMedia('(prefers-reduced-motion: reduce)');
    document.documentElement.classList.toggle('has-view-transitions',typeof document.startViewTransition==='function');
    let activeTransition,motionRevision=0;
    const foodAnimations=new Set();
    function foodPositions() {
      return new Map([...$('plate-art').querySelectorAll('[data-dish-key]')].map(node=>[node.dataset.dishKey,node.getBoundingClientRect()]));
    }
    function animateFood(previous,direction) {
      for(const animation of foodAnimations) animation.cancel();
      foodAnimations.clear();
      if(!$('filter-panel').hidden) return;
      for(const node of $('plate-art').querySelectorAll('[data-dish-key]')) {
        const before=previous.get(node.dataset.dishKey),after=node.getBoundingClientRect();
        const transform=getComputedStyle(node).transform;
        let frames;
        if(before && !reducedMotion.matches) {
          const dx=before.left-after.left,dy=before.top-after.top;
          if(Math.abs(dx)<.5 && Math.abs(dy)<.5 && Math.abs(before.width-after.width)<.5 && Math.abs(before.height-after.height)<.5) continue;
          frames=[{transform:`translate(${dx}px,${dy}px) scale(${before.width/after.width},${before.height/after.height}) ${transform}`},{transform}];
        } else if(!before) {
          frames=reducedMotion.matches?[{opacity:0},{opacity:1}]:[{opacity:0,transform:`translateX(${direction*24}px) ${transform}`},{opacity:1,transform}];
        } else continue;
        // Animate the live artwork inside its blend layer, never a detached snapshot.
        const animation=node.animate(frames,{duration:reducedMotion.matches?120:280,easing:spring});
        foodAnimations.add(animation);
        animation.finished.then(()=>foodAnimations.delete(animation),()=>foodAnimations.delete(animation));
      }
    }
    function clearMotionNames() {
      document.querySelectorAll('[data-motion-name]').forEach(node=>{node.style.viewTransitionName='none';delete node.dataset.motionName;});
    }
    const spring='cubic-bezier(.22,1,.36,1)';
    function stopPlateAnimations() {
      ++motionRevision;activeTransition?.skipTransition();
      for(const animation of foodAnimations) animation.cancel();
      foodAnimations.clear();
    }
    function positionIndicator(host, selected, className) {
      if(!selected) return;
      let indicator=host.querySelector('.'+className);
      const existing=Boolean(indicator);
      if(!indicator) {indicator=document.createElement('span');indicator.className=className;indicator.setAttribute('aria-hidden','true');host.prepend(indicator);}
      const from=getComputedStyle(indicator).transform;
      const to=`translate(${selected.offsetLeft}px,${selected.offsetTop}px)`;
      indicator.getAnimations().forEach(animation=>animation.cancel());
      indicator.style.width=selected.offsetWidth+'px';indicator.style.height=selected.offsetHeight+'px';indicator.style.transform=to;
      if(existing && from!=='none' && document.startViewTransition && !reducedMotion.matches) {
        const animation=indicator.animate([{transform:from},{transform:to}],{duration:300,easing:spring});
        animation.finished.then(()=>animation.cancel(),()=>{});
      }
    }
    function syncMotionControls() {
      positionIndicator(document.querySelector('.goals'),document.querySelector('[data-goal][aria-pressed="true"]'),'mode-indicator');
      positionIndicator($('days'),$('days').querySelector('[aria-pressed="true"]'),'day-indicator');
      $('plate').dataset.mode=selection.goal;
      for(const layer of document.querySelectorAll('[data-tint]')) layer.style.opacity=String(layer.dataset.tint===selection.goal?1:0);
    }
    function transitionParts(kind) {
      clearMotionNames();
      const parts=new Map();
      function name(node,key,value='') {
        if(!node || node.hidden) return;
        node.style.viewTransitionName=key;node.dataset.motionName=key;
        parts.set(key,{value});
      }
      if(kind==='day') name($('date'),'menu-date');
      if(kind!=='indicator') {
        name($('plate-title'),'dish-title',$('plate-title').textContent);
        name($('plate-side'),'dish-subtitle',$('plate-side').textContent);
        name($('plate-counter'),'dish-counter',$('plate-counter').textContent);
        document.querySelectorAll('[data-digit-name]').forEach(node=>name(node,node.dataset.digitName,node.textContent));
      }
      return parts;
    }
    function animateTransition(transition, oldParts, newParts, kind, direction) {
      const reduced=reducedMotion.matches;
      function track(animation) {transition.finished.then(()=>animation.cancel(),()=>animation.cancel());return animation;}
      function animate(name,side,frames,duration=300,delay=0) {
        track(document.documentElement.animate(frames,{duration,delay,easing:reduced?'ease':spring,fill:'both',pseudoElement:`::view-transition-${side}(${name})`}));
      }
      for(const name of new Set([...oldParts.keys(),...newParts.keys()])) {
        const old=oldParts.has(name),fresh=newParts.has(name);
        if(reduced) {
          if(old) animate(name,'old',[{opacity:1},{opacity:0}],120);
          if(fresh) animate(name,'new',[{opacity:0},{opacity:1}],120);
          continue;
        }
        if(name.startsWith('digit-')) {
          if(old && fresh && oldParts.get(name).value===newParts.get(name).value) continue;
          if(old) animate(name,'old',[{transform:'translateY(0)'},{transform:'translateY(-110%)'}],400);
          if(fresh) animate(name,'new',[{transform:'translateY(110%)'},{transform:'translateY(0)'}],400);
        } else {
          const distance=12,duration=kind==='day'?320:240;
          if(old) animate(name,'old',[{opacity:1,transform:'translateX(0)'},{opacity:0,transform:`translateX(${-direction*distance}px)`}],duration);
          if(fresh) animate(name,'new',[{opacity:0,transform:`translateX(${direction*distance}px)`},{opacity:1,transform:'translateX(0)'}],duration);
        }
      }
    }
    async function motionUpdate(update,kind='mode',direction=1) {
      const previousFood=foodPositions();
      for(const animation of foodAnimations) animation.cancel();
      foodAnimations.clear();
      const revision=++motionRevision,previous=activeTransition;
      previous?.skipTransition();
      if(kind==='day' || kind==='mode') {
        drag=undefined;wheelGesture=undefined;clearTimeout(wheelTimer);returnAnimation?.cancel();
        $('plate-art').style.transform='';
      }
      if(previous) await previous.updateCallbackDone.catch(()=>{});
      if(revision!==motionRevision) {if(kind==='day'){update();syncMotionControls();}return false;}
      if(!document.startViewTransition || !$('filter-panel').hidden) {update();syncMotionControls();animateFood(previousFood,direction);return true;}
      const oldParts=transitionParts(kind);
      let newParts;
      const transition=document.startViewTransition(()=>{
        if(revision!==motionRevision) {if(kind==='day'){update();syncMotionControls();}return;}
        update();syncMotionControls();newParts=transitionParts(kind);
      });
      activeTransition=transition;
      transition.ready.then(()=>{
        if(revision===motionRevision && newParts) {animateTransition(transition,oldParts,newParts,kind,direction);animateFood(previousFood,direction);}
      }).catch(()=>{});
      transition.finished.catch(()=>{}).then(()=>{if(activeTransition===transition) {activeTransition=undefined;clearMotionNames();}});
      await transition.updateCallbackDone;
      return revision===motionRevision;
    }
    function render(kind='mode',direction=1) {
      return motionUpdate(()=>{syncControls();renderPlate();},kind,direction);
    }
    function numberValue(id,prefix,text) {
      const node=$(id);node.replaceChildren();node.setAttribute('aria-label',prefix+text);
      const fixed=document.createElement('span');fixed.className='number-prefix';fixed.textContent=prefix;fixed.setAttribute('aria-hidden','true');node.append(fixed);
      const digits=document.createElement('span');digits.className='number-digits';digits.setAttribute('aria-hidden','true');
      let index=0;
      for(const char of [...text].reverse()) {
        const cell=document.createElement('span');cell.className=/\d/.test(char)?'digit-cell':'digit-separator';cell.textContent=char;
        if(/\d/.test(char)) cell.dataset.digitName=`digit-${id}-${index++}`;
        digits.prepend(cell);
      }
      node.append(digits);
    }
    function renderPager(count) {
      const host=$('option-status'),indicator=host.querySelector('.pager-indicator');host.replaceChildren(...(indicator?[indicator]:[]));host.setAttribute('aria-label','Lunch option '+(plateIndex+1)+' of '+count);
      for(let index=0;index<count;index++) {
        const dot=document.createElement('button');dot.type='button';dot.className='pager-dot';
        dot.setAttribute('aria-label','Lunch option '+(index+1)+' of '+count);dot.setAttribute('aria-pressed',String(index===plateIndex));
        dot.addEventListener('click',()=>{const direction=Math.sign(index-plateIndex);if(!direction)return;plateIndex=index;render('pager',direction);});host.append(dot);
      }
      positionIndicator(host,host.querySelector('[aria-pressed="true"]'),'pager-indicator');
      $('previous').disabled=plateIndex===0;$('next').disabled=plateIndex===count-1;
    }
    reducedMotion.addEventListener('change',stopPlateAnimations);
    try {
      const saved=JSON.parse(localStorage.getItem('mensa-plate') || 'null');
      if(saved && goals.includes(saved.goal) && typeof saved.vegan==='boolean') selection={goal:saved.goal,vegan:saved.vegan,noPork:saved.noPork===true,noBeef:saved.noBeef===true,noMeat:saved.noMeat===true};
    } catch(_) {}
    const requested=new URLSearchParams(location.search);
    if(goals.includes(requested.get('goal'))) selection={...selection,goal:requested.get('goal'),vegan:requested.get('vegan')==='1'};
    if(selection.vegan) selection.noMeat=false;
    const money=cents=>'€'+(cents/100).toFixed(2);
    const rounded=value=>Math.round(value).toLocaleString('en-GB');
    const berlinDate=MenuDays.berlinDate;
    const defaultMenuDay=MenuDays.defaultMenuDay;
    function filterProfile() {
      if(selection.noMeat) return 'vegetarian';
      if(selection.noPork && selection.noBeef) return 'no_pork_beef';
      if(selection.noPork) return 'no_pork';
      if(selection.noBeef) return 'no_beef';
      return '';
    }
    function allowedItem(item) {
      if(!filterProfile()) return true;
      if(selection.noMeat) return item.diet==='vegan' || item.diet==='vegetarian' || item.is_vegan===true;
      if(item.is_vegan===true || ['vegan','vegetarian'].includes(item.diet)) return true;
      let types=item.meat_types;
      if(!Array.isArray(types)) {
        types=[];
        const markers=item.markers || [],name=(item.name || '')+' '+(item.name_en || '');
        if(markers.includes('S') || /schwein|speck|schinken|pork|bacon/i.test(name)) types.push('pork');
        if(markers.includes('R') || markers.includes('K') || /rind|kalb|beef|veal/i.test(name)) types.push('beef');
        if(markers.includes('G') || /hähn|hühn|pute|chicken|turkey/i.test(name)) types.push('poultry');
        if(item.diet==='fish') types.push('fish');
        if(!types.length) types.push('unknown');
      }
      return !types.includes('unknown') && !(selection.noPork && types.includes('pork')) && !(selection.noBeef && types.includes('beef'));
    }
    function variant() {
      const profile=filterProfile();
      if(profile && !selection.vegan && data.filtered_variants?.[selection.goal+'_'+profile]) return data.filtered_variants[selection.goal+'_'+profile];
      return data.variants[selection.goal+(selection.vegan?'_vegan':'_all')];
    }
    const visiblePlates=()=>variant().plates.filter(p=>{
      const key=PlateReports.plateKey(p.items.map(i=>i.id));
      return p.items.every(allowedItem) && !brokenKeys.has(key) && !reports.isHidden(selectedDate,key);
    });
    const currentPlate=()=>visiblePlates()[plateIndex];
    const availableExtras=()=>data.extras[selection.vegan?'vegan':'all'].filter(allowedItem);
    const activeExtras=()=>availableExtras().filter((_,index)=>selectedExtras.has(index));
    function syncControls() {
      document.querySelectorAll('[data-goal]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.goal===selection.goal)));
      $('vegan').checked=selection.vegan;
      const vegetarian=selection.vegan || selection.noMeat;
      $('no-meat').checked=vegetarian;$('no-meat').disabled=selection.vegan;
      $('no-pork').checked=vegetarian || selection.noPork;$('no-beef').checked=vegetarian || selection.noBeef;
      $('no-pork').disabled=selection.vegan || selection.noMeat;
      $('no-beef').disabled=selection.vegan || selection.noMeat;
      const labels=selection.vegan?['Vegan']:selection.noMeat?['Vegetarian']:[selection.noPork?'No pork':null,selection.noBeef?'No beef':null].filter(Boolean);
      $('diet-summary').textContent=labels.length?labels[0]+(labels.length>1?' +'+(labels.length-1):''):'';
      $('diet-summary').hidden=!labels.length;
      $('filter-toggle').dataset.active=String(labels.length>0);
      $('filter-toggle').setAttribute('aria-label','Diet'+(labels.length?': '+labels.join(', '):''));
    }
    function saveAndRender() {
      try {localStorage.setItem('mensa-plate',JSON.stringify(selection));} catch(_) {}
      $('extras-wrap').open=false;
      plateIndex=0;selectedExtras.clear();
      syncControls();if(data) render();
    }
    function empty(title,text,icon='empty') {
      $('plate').classList.add('is-empty');$('secondary-actions').hidden=true;$('plate-side').hidden=true;$('plate-counter').hidden=true;
      DishIcons.compose($('plate-art'),[],{fallback:icon});
      $('items').replaceChildren();$('plate-title').textContent='Your plate';
      for(const id of ['totals','relaxed-note','plate-actions','extras-wrap','report-plate']) $(id).hidden=true;
      $('empty').hidden=false;$('empty-title').textContent=title;$('empty-text').textContent=text || '';
      $('announcement').textContent=title;
    }
    function totals() {
      const total={...currentPlate().total};
      for(const extra of activeExtras()) {
        total.price_cents+=extra.price_cents;total.kcal+=extra.kcal;total.protein_g+=extra.protein_g;total.weight_g+=extra.weight_g;
      }
      return total;
    }
    function renderTotals(announce=false) {
      const total=totals();
      numberValue('price','€',(total.price_cents/100).toFixed(2));numberValue('kcal','~',rounded(total.kcal));numberValue('protein','~',rounded(total.protein_g));
      $('includes-extras').hidden=selectedExtras.size===0;
      if(announce) $('announcement').textContent='Tray total '+money(total.price_cents)+', approximately '+rounded(total.kcal)+' calories and '+rounded(total.protein_g)+' grams protein.';
    }
    function renderExtras() {
      $('extras').replaceChildren();$('extras-wrap').hidden=availableExtras().length===0;
      availableExtras().forEach((extra,index)=>{
        const button=document.createElement('button');button.type='button';button.className='extra-chip';
        const art=document.createElement('span');art.className='extra-icon';art.append(DishIcons.create(DishIcons.classify(extra)));
        const name=document.createElement('span');name.className='extra-name';name.textContent=briefDish(extra);
        const price=document.createElement('span');price.className='extra-price';price.textContent=money(extra.price_cents);
        const mark=document.createElement('span');mark.className='extra-add';mark.setAttribute('aria-hidden','true');mark.textContent=selectedExtras.has(index)?'−':'+';
        button.append(art,name,price,mark);
        button.setAttribute('aria-label',extra.name_en+' · '+extra.serving+' · '+money(extra.price_cents)+' · '+rounded(extra.protein_g)+'g protein, estimated');
        button.setAttribute('aria-pressed',String(selectedExtras.has(index)));
        button.addEventListener('click',()=>{
          if(selectedExtras.has(index)) selectedExtras.delete(index);else selectedExtras.add(index);
          mark.textContent=selectedExtras.has(index)?'−':'+';
          button.setAttribute('aria-pressed',String(selectedExtras.has(index)));render('mode');
        });
        $('extras').append(button);
      });
    }
    function renderItems() {
      const p=currentPlate();
      $('items').replaceChildren();
      for(const item of [...p.items,...activeExtras()]) {
        const li=document.createElement('li');li.className='item';
        const art=document.createElement('div');art.className='item-icon';art.append(DishIcons.create(DishIcons.classify(item)));
        const portion=document.createElement('div');portion.className='serving';
        if(Number.isFinite(item.count)) {
          const count=document.createElement('span');count.className='count';count.textContent=item.count;
          portion.append(count,document.createTextNode(item.unit+(item.count===1?'':'s')));
        } else portion.textContent=item.serving || rounded(item.weight_g)+'g';
        const description=document.createElement('div');description.className='item-description';
