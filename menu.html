<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f5f1">
  <meta name="description" content="A lunch plate for your goal at Mensa Arcisstraße. Student prices, simple scoops, and estimated nutrition.">
  <title>Mensa Plate — Arcisstraße</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/webp" href="./icons/ui/tray.webp">
  <link rel="apple-touch-icon" href="./icons/ui/app-180.png">
  <link rel="preload" href="./assets/fonts/bricolage-grotesque-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="./icons/artwork.css">
  <link rel="stylesheet" href="./menu.css?v=filters-motion-2">
</head>
<body>
  <div class="shell">
    <header>
      <a class="brand" href="./">Mensa Plate<span aria-hidden="true">.</span></a>
      <span class="location">Arcisstraße</span>
    </header>
    <main>
      <div class="heading">
        <div><h1>Your plate</h1><time id="date" class="date"></time></div>
        <div class="heading-actions">
          <div id="days" class="day-strip" role="group" aria-label="Menu day" hidden></div>
          <div class="filter-control">
            <button id="filter-toggle" class="filter-toggle" type="button" aria-label="Dietary filters" aria-expanded="false" aria-controls="filter-panel">
              <img class="filter-off" src="./icons/ui/filter_untapped.png" alt="" width="1254" height="1254">
              <img class="filter-on" src="./icons/ui/filter_tapped.png" alt="" width="1254" height="1254">
              <span id="filter-count" class="filter-count" hidden></span>
            </button>
            <section id="filter-panel" class="filter-panel" aria-label="Dietary filters" hidden>
              <h2>Dietary filters</h2>
              <label><input id="no-pork" type="checkbox">No pork</label>
              <label><input id="no-beef" type="checkbox">No beef</label>
              <label><input id="no-meat" type="checkbox">Vegetarian</label>
              <button id="clear-filters" class="text-button" type="button">Clear filters</button>
            </section>
          </div>
        </div>
      </div>
      <div class="controls">
        <div class="goals" role="group" aria-label="Lunch goal">
          <button type="button" data-goal="bulk" aria-pressed="true"><span class="artwork art-dumbbell" data-icon="dumbbell"><img src="./icons/ui/dumbbell.webp" width="640" height="640" alt="" decoding="async"></span><span>Bulk</span><span class="goal-check" aria-hidden="true"></span></button>
          <button type="button" data-goal="cut" aria-pressed="false"><span class="artwork art-tape" data-icon="tape"><img src="./icons/ui/tape.webp" width="640" height="640" alt="" decoding="async"></span><span>Cut</span><span class="goal-check" aria-hidden="true"></span></button>
          <button type="button" data-goal="budget" aria-pressed="false"><span class="artwork art-coins" data-icon="coins"><img src="./icons/ui/coins.webp" width="640" height="640" alt="" decoding="async"></span><span>Budget</span><span class="goal-check" aria-hidden="true"></span></button>
        </div>
        <label class="toggle"><input id="vegan" type="checkbox" role="switch"><span class="vegan-face"><span class="artwork art-leaf" data-icon="leaf"><img src="./icons/ui/leaf.webp" width="640" height="640" alt="" decoding="async"></span><span>Vegan</span><span class="switch" aria-hidden="true"></span></span></label>
      </div>
      <section class="receipt" aria-labelledby="plate-title" aria-busy="true" id="plate">
        <div class="plate-overview">
          <div class="plate-art dish-scene" id="plate-art"><span id="plate-illustration" class="artwork art-tray" data-icon="tray"><img src="./icons/ui/tray.webp" width="1254" height="1254" alt="" decoding="async"></span></div>
          <div class="plate-summary">
            <h2 id="plate-title">Your plate</h2>
            <p class="plate-side" id="plate-side" hidden></p>
            <div class="totals" id="totals" hidden>
              <div><span id="price" class="total-value total-price"></span><span class="total-label">Student price</span><span id="includes-extras" class="total-label" hidden>incl. extras</span></div>
              <div><span id="kcal" class="total-value"></span><span class="total-label">kcal</span></div>
              <div><span id="protein" class="total-value"></span><span class="total-label">g protein</span></div>
            </div>
            <p class="details relaxed-note" id="relaxed-note" hidden></p>
            <div class="empty" id="empty" hidden><h3 id="empty-title"></h3><p id="empty-text"></p></div>
          </div>
        </div>
        <div class="plate-actions" id="plate-actions" hidden>
          <div class="alternatives" id="alternatives">
            <button class="arrow" id="previous" type="button" aria-label="Previous lunch">←</button>
            <span id="option-status" aria-live="off">1 / 3</span>
            <button class="arrow" id="next" type="button" aria-label="Next lunch">→</button>
          </div>
          <button class="text-button" id="share" type="button">Share plate <span aria-hidden="true">↗</span></button>
        </div>
        <button class="text-button report-button" id="report-plate" type="button" aria-haspopup="dialog" aria-controls="report-sheet" hidden>Can't get this plate?</button>
      </section>
      <dialog id="report-sheet" class="report-sheet" aria-labelledby="report-title">
        <h2 id="report-title">Which dish was at another counter?</h2>
        <div id="report-dishes" class="report-dishes"></div>
        <p id="report-error" class="details" role="status"></p>
        <button class="text-button" id="report-close" type="button">Cancel</button>
      </dialog>
      <div class="secondary-actions" id="secondary-actions" hidden>
        <section class="ingredient-panel" id="plate-details" aria-labelledby="ingredients-title">
          <h2 class="ingredients-title" id="ingredients-title">Details</h2>
          <div class="ingredient-content">
            <p class="reason" id="reason" hidden></p>
            <ul class="items" id="items"></ul>
            <p class="details" id="details" hidden></p>
          </div>
        </section>
        <details class="disclosure" id="extras-wrap">
          <summary id="extras-title">Add to tray<span class="disclosure-mark" aria-hidden="true">+</span></summary>
          <div class="disclosure-content"><div class="extra-chips" id="extras" role="group" aria-label="Optional soup and dessert"></div></div>
        </details>
      </div>
      <p id="announcement" class="sr-only" aria-live="polite" aria-atomic="true"></p>
      <p id="notice" class="notice" role="status"></p>
      <noscript><p>Enable JavaScript to choose a plate, or visit the official menu below.</p></noscript>
    </main>
    <footer>
      <p>Nutrition values are estimates.</p>
      <a href="https://www.studierendenwerk-muenchen-oberbayern.de/gastronomie/speiseplan/speiseplan_421_-de.html" target="_blank" rel="noopener noreferrer">Official menu ↗</a>
    </footer>
  </div>
  <script src="./dish-icons.js"></script>
  <script src="./menu-days.js"></script>
  <script src="./report-config.js"></script>
  <script src="./report-client.js"></script>
  <script>
    'use strict';
    const $ = id => document.getElementById(id);
    const goals = ['bulk','cut','budget'];
    const titles = {bulk:'Bulk',cut:'Cut',budget:'Budget'};
    const dietLabels = {fish:'Fish',meat:'Meat',vegetarian:'Veg',vegan:'Vegan'};
    const SITE_URL = 'https://yagizdas.github.io/platum/';
    let selection = {goal:'bulk',vegan:false,noPork:false,noBeef:false,noMeat:false};
    let data, stale=false, plateIndex=0, selectedExtras=new Set(), shareTimer;
    let weekIndex, selectedDate, loadToken=0;
    const reports=PlateReports.create(globalThis.MENSA_REPORT_ENDPOINT);
    let brokenKeys=new Set();
    const reducedMotion=matchMedia('(prefers-reduced-motion: reduce)');
    let plateAnimations=[],plateSnapshot,hasRenderedPlate=false;
    function stopPlateAnimations() {
      plateAnimations.forEach(animation=>animation.cancel());plateAnimations=[];
      plateSnapshot?.remove();plateSnapshot=undefined;
    }
    function capturePlate() {
      if(reducedMotion.matches || !hasRenderedPlate || $('plate').classList.contains('is-empty')) return;
      const overview=$('plate').querySelector('.plate-overview'),rect=overview.getBoundingClientRect();
      plateSnapshot=overview.cloneNode(true);
      plateSnapshot.removeAttribute('id');
      plateSnapshot.querySelectorAll('[id]').forEach(node=>node.removeAttribute('id'));
      plateSnapshot.setAttribute('aria-hidden','true');plateSnapshot.inert=true;
      plateSnapshot.classList.add('plate-snapshot');
      Object.assign(plateSnapshot.style,{top:(rect.top+scrollY)+'px',left:(rect.left+scrollX)+'px',width:rect.width+'px',height:rect.height+'px'});
      document.body.append(plateSnapshot);
    }
    function animatePlateChange() {
      const snapshot=plateSnapshot;
      if(!snapshot) return;
      if(typeof snapshot.animate!=='function') {snapshot.remove();return;}
      const animation=snapshot.animate([{opacity:1},{opacity:0}],{duration:200,easing:'ease-in-out'});
      plateAnimations.push(animation);
      animation.finished.catch(()=>{}).then(()=>snapshot.remove());
    }
    reducedMotion.addEventListener('change',stopPlateAnimations);
    try {
      const saved=JSON.parse(localStorage.getItem('mensa-plate') || 'null');
      if(saved && goals.includes(saved.goal) && typeof saved.vegan==='boolean') selection={goal:saved.goal,vegan:saved.vegan,noPork:saved.noPork===true,noBeef:saved.noBeef===true,noMeat:saved.noMeat===true};
    } catch(_) {}
    const requested=new URLSearchParams(location.search);
    if(goals.includes(requested.get('goal'))) selection={...selection,goal:requested.get('goal'),vegan:requested.get('vegan')==='1'};
    const money=cents=>'€'+(cents/100).toFixed(2);
    const rounded=value=>Math.round(value).toLocaleString('en-GB');
    const berlinDate=MenuDays.berlinDate;
    const defaultMenuDay=MenuDays.defaultMenuDay;
    function filterProfile() {
      if(selection.noMeat) return 'vegetarian';
      if(selection.noPork && selection.noBeef) return 'no_pork_beef';
      if(selection.noPork) return 'no_pork';
      if(selection.noBeef) return 'no_beef';
      return '';
    }
    function allowedItem(item) {
      if(!filterProfile()) return true;
      if(selection.noMeat) return item.diet==='vegan' || item.diet==='vegetarian' || item.is_vegan===true;
      if(item.is_vegan===true || ['vegan','vegetarian'].includes(item.diet)) return true;
      let types=item.meat_types;
      if(!Array.isArray(types)) {
        types=[];
        const markers=item.markers || [],name=(item.name || '')+' '+(item.name_en || '');
        if(markers.includes('S') || /schwein|speck|schinken|pork|bacon/i.test(name)) types.push('pork');
        if(markers.includes('R') || markers.includes('K') || /rind|kalb|beef|veal/i.test(name)) types.push('beef');
        if(markers.includes('G') || /hähn|hühn|pute|chicken|turkey/i.test(name)) types.push('poultry');
        if(item.diet==='fish') types.push('fish');
        if(!types.length) types.push('unknown');
      }
      return !types.includes('unknown') && !(selection.noPork && types.includes('pork')) && !(selection.noBeef && types.includes('beef'));
    }
    function variant() {
      const profile=filterProfile();
      if(profile && !selection.vegan && data.filtered_variants?.[selection.goal+'_'+profile]) return data.filtered_variants[selection.goal+'_'+profile];
      return data.variants[selection.goal+(selection.vegan?'_vegan':'_all')];
    }
    const visiblePlates=()=>variant().plates.filter(p=>{
      const key=PlateReports.plateKey(p.items.map(i=>i.id));
      return p.items.every(allowedItem) && !brokenKeys.has(key) && !reports.isHidden(selectedDate,key);
    });
    const currentPlate=()=>visiblePlates()[plateIndex];
    const availableExtras=()=>data.extras[selection.vegan?'vegan':'all'].filter(allowedItem);
    const activeExtras=()=>availableExtras().filter((_,index)=>selectedExtras.has(index));
    function syncControls() {
      document.querySelectorAll('[data-goal]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.goal===selection.goal)));
      $('vegan').checked=selection.vegan;
      $('no-pork').checked=selection.noPork;$('no-beef').checked=selection.noBeef;$('no-meat').checked=selection.noMeat;
      $('no-pork').disabled=selection.noMeat;$('no-beef').disabled=selection.noMeat;
      const count=selection.noMeat?1:Number(selection.noPork)+Number(selection.noBeef);
      $('filter-count').textContent=count;$('filter-count').hidden=!count;
      $('filter-toggle').dataset.active=String(count>0 || !$('filter-panel').hidden);
      $('filter-toggle').setAttribute('aria-label',count?'Dietary filters, '+count+' active':'Dietary filters');
    }
    function saveAndRender() {
      try {localStorage.setItem('mensa-plate',JSON.stringify(selection));} catch(_) {}
      $('extras-wrap').open=false;
      plateIndex=0;selectedExtras.clear();syncControls();
      if(data) render();
    }
    function empty(title,text,icon='empty') {
      stopPlateAnimations();
      $('plate').classList.add('is-empty');$('secondary-actions').hidden=true;$('plate-side').hidden=true;
      DishIcons.compose($('plate-art'),[],{fallback:icon});
      $('items').replaceChildren();$('plate-title').textContent='Your plate';$('reason').hidden=true;
      for(const id of ['totals','details','relaxed-note','plate-actions','extras-wrap','report-plate']) $(id).hidden=true;
      $('empty').hidden=false;$('empty-title').textContent=title;$('empty-text').textContent=text || '';
      $('announcement').textContent=title;
    }
    function totals() {
      const total={...currentPlate().total};
      for(const extra of activeExtras()) {
        total.price_cents+=extra.price_cents;total.kcal+=extra.kcal;total.protein_g+=extra.protein_g;total.weight_g+=extra.weight_g;
      }
      return total;
    }
    function renderTotals(announce=false) {
      const total=totals();
      $('price').textContent=money(total.price_cents);$('kcal').textContent='~'+rounded(total.kcal);$('protein').textContent='~'+rounded(total.protein_g);
      $('includes-extras').hidden=selectedExtras.size===0;
      const estimated=currentPlate().has_estimated_prices || activeExtras().some(e=>e.price_source==='config');
      $('details').textContent=rounded(total.weight_g)+'g total · Scoops are approximate; weighed at checkout.'+(estimated?' Some prices use category estimates.':'');
      if(announce) $('announcement').textContent='Tray total '+money(total.price_cents)+', approximately '+rounded(total.kcal)+' calories and '+rounded(total.protein_g)+' grams protein.';
    }
    function renderExtras() {
      $('extras').replaceChildren();$('extras-wrap').hidden=availableExtras().length===0;
      availableExtras().forEach((extra,index)=>{
        const button=document.createElement('button');button.type='button';button.className='extra-chip';
        const art=document.createElement('span');art.className='extra-icon';art.append(DishIcons.create(DishIcons.classify(extra)));
        const name=document.createElement('span');name.className='extra-name';name.textContent=briefDish(extra);
        const price=document.createElement('span');price.className='extra-price';price.textContent=money(extra.price_cents);
        const mark=document.createElement('span');mark.className='extra-add';mark.setAttribute('aria-hidden','true');mark.textContent=selectedExtras.has(index)?'−':'+';
        button.append(art,name,price,mark);
        button.setAttribute('aria-label',extra.name_en+' · '+extra.serving+' · '+money(extra.price_cents)+' · '+rounded(extra.protein_g)+'g protein, estimated');
        button.setAttribute('aria-pressed',String(selectedExtras.has(index)));
        button.addEventListener('click',()=>{
          if(selectedExtras.has(index)) selectedExtras.delete(index);else selectedExtras.add(index);
          mark.textContent=selectedExtras.has(index)?'−':'+';
          button.setAttribute('aria-pressed',String(selectedExtras.has(index)));renderIllustration();renderItems();renderTotals(true);
        });
        $('extras').append(button);
      });
    }
    function renderItems() {
      const p=currentPlate();
      $('items').replaceChildren();
      for(const item of [...p.items,...activeExtras()]) {
        const li=document.createElement('li');li.className='item';
        const art=document.createElement('div');art.className='item-icon';art.append(DishIcons.create(DishIcons.classify(item)));
        const portion=document.createElement('div');portion.className='serving';
        if(Number.isFinite(item.count)) {
          const count=document.createElement('span');count.className='count';count.textContent=item.count;
          portion.append(count,document.createTextNode(item.unit+(item.count===1?'':'s')));
        } else portion.textContent=item.serving || rounded(item.weight_g)+'g';
        const description=document.createElement('div');description.className='item-description';
        const name=document.createElement('p');name.className='dish-name';name.lang='de';name.textContent=item.name;
        const en=document.createElement('span');en.className='english';en.textContent=item.name_en;
        const meta=document.createElement('span');meta.className='meta';
        meta.textContent=(item.standing?'Beilagen counter · usually there':item.station==='Unspecified'?'Main':item.station)+' · '+rounded(item.weight_g)+'g';
        const tag=document.createElement('span');tag.className='diet-tag';tag.textContent=dietLabels[item.diet] || '';
        description.append(name,en,meta,tag);
        const price=document.createElement('span');price.className='item-price';price.textContent=money(item.price_cents);
        li.append(art,portion,description,price);$('items').append(li);
      }
    }
    function renderIllustration() {
      DishIcons.compose($('plate-art'),[...currentPlate().items,...activeExtras()]);
    }
    function render() {
      stopPlateAnimations();capturePlate();
      if(stale) return empty(selectedDate && selectedDate!==berlinDate()?'That day’s plates aren’t ready.':'Today’s plates aren’t ready.','The published menu does not match '+(selectedDate || berlinDate())+'. Check the official menu for that day.');
      const v=variant();
      if(data.state==='closed') return empty('No menu today.',v.message);
      if(data.state==='unavailable') return empty('Plates are on the way.',data.reason || v.message);
      const plates=visiblePlates();
      if(v.state!=='ready' || !plates.length) return empty(filterProfile()?'No plates match your filters.':'No plate fits this goal today.',filterProfile()?'Try another goal or adjust your dietary filters.':v.message);
      plateIndex=Math.min(plateIndex,plates.length-1);
      const p=currentPlate();$('empty').hidden=true;$('plate').classList.remove('is-empty');$('secondary-actions').hidden=false;
      const main=p.items.find(item=>item.role==='main') || p.items[0],title=briefDish(main);
      renderIllustration();
      $('plate-title').textContent=title;$('plate-title').lang=main.name_en?'en':'de';
      $('plate-title').classList.toggle('is-long',title.length>30);
      $('plate-side').textContent=p.items.filter(item=>item!==main).map(briefDish).join(' + ');$('plate-side').hidden=p.items.length<2;
      $('reason').textContent=p.reason || '';$('reason').hidden=!p.reason;
      renderItems();
      $('totals').hidden=false;$('details').hidden=false;
      $('relaxed-note').textContent=v.note || '';$('relaxed-note').hidden=!v.relaxed || !v.note;
      $('plate-actions').hidden=false;$('alternatives').hidden=plates.length<2;
      $('option-status').textContent=(plateIndex+1)+' / '+plates.length;
      $('option-status').setAttribute('aria-label','Lunch option '+(plateIndex+1)+' of '+plates.length);
      $('announcement').textContent='Option '+(plateIndex+1)+' of '+plates.length+': '+p.title;
      $('report-plate').hidden=!reports.enabled || p.items.some(i=>!i.id);
      $('share').textContent='Share plate';renderExtras();renderTotals();hasRenderedPlate=true;animatePlateChange();
    }
    function cycle(direction) {
      if(!data || stale || variant().state!=='ready') return;
      const count=visiblePlates().length;
      if(count<2) return;
      plateIndex=(plateIndex+direction+count)%count;render();
    }
    function shortName(name) {return name.replace(/\s*\(1\s*Stück\)/gi,'').split(/\s+(?:mit|auf|aus|in|an)\s+/i)[0];}
    function briefDish(item) {
      return (item.name_en || item.name).replace(/\s*\([^)]*\)/g,'').split(/\s+(?:with|on|served|in|made from)\s+/i)[0].trim();
    }
    function shareText() {
      const entries=currentPlate().items.map(item=>(item.unit==='piece'?'':item.count+' scoop'+(item.count===1?'':'s')+' ')+shortName(item.name));
      for(const extra of activeExtras()) entries.push(extra.serving+' '+shortName(extra.name));
      const t=totals();
      const exclusions=[selection.noMeat?'vegetarian':null,!selection.noMeat&&selection.noPork?'no pork':null,!selection.noMeat&&selection.noBeef?'no beef':null].filter(Boolean).join(', ');
      return (exclusions?'Filters: '+exclusions+' · ':'')+'Lunch at Arcisstraße ('+(selection.vegan?'Vegan ':'')+titles[selection.goal]+'): '+entries.join(' + ')+' · '+money(t.price_cents)+' · ~'+rounded(t.kcal)+' kcal · ~'+rounded(t.protein_g)+'g protein · '+SITE_URL;
    }
    async function share() {
      const text=shareText();
      if(navigator.share) {
        try {await navigator.share({title:'Mensa Plate',text});return;} catch(error) {if(error.name==='AbortError') return;}
      }
      try {await navigator.clipboard.writeText(text);$('share').textContent='Copied';}
      catch(_) {$('share').textContent='Copy unavailable';}
      clearTimeout(shareTimer);shareTimer=setTimeout(()=>{$('share').textContent='Share plate';},2000);
    }
    function validateDay(payload) {
      if(payload.schema_version!==2 || !/^\d{4}-\d{2}-\d{2}$/.test(payload.date) || !payload.variants || !payload.extras) throw new Error('Invalid menu');
      for(const goal of goals) for(const diet of ['all','vegan']) {
        const v=payload.variants[goal+'_'+diet];
        if(!v || !Array.isArray(v.plates) || (v.state==='ready' && !v.plates.length)) throw new Error('Invalid variant');
        for(const p of v.plates) if(!Array.isArray(p.items) || !p.total || !['price_cents','kcal','protein_g','weight_g'].every(k=>Number.isFinite(p.total[k]))) throw new Error('Invalid totals');
      }
      if(!Array.isArray(payload.extras.all) || !Array.isArray(payload.extras.vegan)) throw new Error('Invalid extras');
      return payload;
    }
    document.querySelectorAll('[data-goal]').forEach(button=>button.addEventListener('click',()=>{selection.goal=button.dataset.goal;saveAndRender();}));
    $('vegan').addEventListener('change',()=>{selection.vegan=$('vegan').checked;saveAndRender();});
    function setFilterOpen(open) {
      $('filter-panel').hidden=!open;
      $('filter-toggle').setAttribute('aria-expanded',String(open));
      $('filter-toggle').dataset.active=String(open || Boolean(filterProfile()));
    }
    $('filter-toggle').addEventListener('click',()=>setFilterOpen($('filter-panel').hidden));
    for(const [id,key] of [['no-pork','noPork'],['no-beef','noBeef'],['no-meat','noMeat']]) {
      $(id).addEventListener('change',()=>{selection[key]=$(id).checked;saveAndRender();});
    }
    $('clear-filters').addEventListener('click',()=>{
      selection.noPork=false;selection.noBeef=false;selection.noMeat=false;saveAndRender();
    });
    document.addEventListener('click',event=>{if(!$('filter-panel').hidden && !event.target.closest('.filter-control')) setFilterOpen(false);});
    document.addEventListener('keydown',event=>{
      if(event.key==='Escape' && !$('filter-panel').hidden) {setFilterOpen(false);$('filter-toggle').focus();}
    });
    $('previous').addEventListener('click',()=>cycle(-1));$('next').addEventListener('click',()=>cycle(1));
    $('alternatives').addEventListener('keydown',event=>{if(event.key==='ArrowRight'||event.key==='ArrowLeft'){event.preventDefault();cycle(event.key==='ArrowRight'?1:-1);}});
    $('share').addEventListener('click',share);
    $('report-close').addEventListener('click',()=>$('report-sheet').close());
    $('report-sheet').addEventListener('keydown',event=>{
      if(event.key==='Escape') {event.preventDefault();$('report-sheet').close();return;}
      if(event.key!=='Tab') return;
      const buttons=[...$('report-sheet').querySelectorAll('button:not(:disabled)')];
      const first=buttons[0],last=buttons.at(-1);
      if(event.shiftKey && document.activeElement===first) {event.preventDefault();last.focus();}
      else if(!event.shiftKey && document.activeElement===last) {event.preventDefault();first.focus();}
    });
    $('report-sheet').addEventListener('close',()=>{
      if(!$('report-plate').hidden) $('report-plate').focus();
      else {
        const target=$('empty').hidden?$('plate-title'):$('empty-title');
        target.tabIndex=-1;target.focus();
      }
    });
    $('report-plate').addEventListener('click',()=>{
      const p=currentPlate(),date=selectedDate,key=selection.goal+(selection.vegan?'_vegan':'_all');
      $('report-dishes').replaceChildren();$('report-error').textContent='';
      for(const item of [...p.items,{id:'other',name_en:'Something else'}]) {
        const button=document.createElement('button');button.type='button';button.className='report-dish';button.textContent=briefDish(item);
        button.addEventListener('click',async()=>{
          const buttons=[...$('report-dishes').querySelectorAll('button')];buttons.forEach(b=>b.disabled=true);
          $('report-sheet').setAttribute('aria-busy','true');
          try {
            await reports.report({date,variant:key,plate_dish_ids:p.items.map(i=>i.id),tapped_dish_id:item.id});
            $('report-sheet').close();
            if(data && selectedDate===date && key===selection.goal+(selection.vegan?'_vegan':'_all')) {
              selectedExtras.clear();plateIndex=plateIndex%Math.max(visiblePlates().length,1);render();
              $('notice').textContent="Thanks, we'll swap it.";
            }
          } catch(error) {$('report-error').textContent=error.message || 'Couldn’t send. Please try again.';}
          finally {buttons.forEach(b=>b.disabled=false);$('report-sheet').setAttribute('aria-busy','false');}
        });
        $('report-dishes').append(button);
      }
      $('report-sheet').showModal();
    });
    let touch;
    $('plate').addEventListener('touchstart',event=>{const p=event.touches[0];touch={x:p.clientX,y:p.clientY};},{passive:true});
    $('plate').addEventListener('touchend',event=>{if(!touch) return;const p=event.changedTouches[0],dx=p.clientX-touch.x,dy=p.clientY-touch.y;touch=null;if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.2) cycle(dx<0?1:-1);},{passive:true});
    syncControls();
    function mondayOf(text) {
      const day=new Date(text+'T12:00:00Z');
      day.setUTCDate(day.getUTCDate()-(day.getUTCDay()+6)%7);
      return day.toISOString().slice(0,10);
    }
    function dateLabel(day) {
      $('date').dateTime=day;
      $('date').textContent=new Intl.DateTimeFormat('en-GB',{weekday:'long',day:'numeric',month:'short',timeZone:'Europe/Berlin'}).format(new Date(day+'T12:00:00Z'));
    }
    function renderDays() {
      $('days').replaceChildren();$('days').hidden=!weekIndex;
      if(!weekIndex) return;
      for(const row of weekIndex.days.filter(row=>mondayOf(row.date)===mondayOf(pendingDate || selectedDate))) {
        const button=document.createElement('button');button.type='button';button.className='day-button';
        const date=new Date(row.date+'T12:00:00Z');
        button.append(document.createTextNode(new Intl.DateTimeFormat('en-GB',{weekday:'short',timeZone:'Europe/Berlin'}).format(date)));
        const label=document.createElement('span');label.className='day-date';
        label.textContent=new Intl.DateTimeFormat('en-GB',{day:'numeric',timeZone:'Europe/Berlin'}).format(date);
        button.append(label);button.setAttribute('aria-pressed',String(row.date===(pendingDate || selectedDate)));button.dataset.date=row.date;
        button.setAttribute('aria-label',row.date+(row.state==='closed'?' · no menu':' menu'));
        button.addEventListener('click',()=>selectDay(row));$('days').append(button);
      }
    }
    const menuRequests=new Map(),artworkRequests=new Map();
    function warmArtwork(payload) {
      const variants=[...Object.values(payload.variants),...Object.values(payload.filtered_variants || {})];
      const items=variants.flatMap(variant=>variant.plates.flatMap(plate=>plate.items));
      items.push(...payload.extras.all);
      const keys=new Set(items.map(item=>DishIcons.classify(item)));
      for(const key of keys) {
        if(artworkRequests.has(key)) continue;
        const image=new Image();image.src=DishIcons.assetUrl(key);
        artworkRequests.set(key,image.decode().catch(()=>{}));
      }
      return Promise.all([...keys].map(key=>artworkRequests.get(key)));
    }
    let pendingDate;
    function getMenu(row) {
      if(!menuRequests.has(row.date)) {
        const request=fetch('./'+row.file,{cache:'no-store'}).then(response=>{
          if(!response.ok) throw new Error('Menu request failed');
          return response.json();
        }).then(validateDay).then(payload=>{warmArtwork(payload);return payload;}).catch(error=>{menuRequests.delete(row.date);throw error;});
        menuRequests.set(row.date,request);
      }
      return menuRequests.get(row.date);
    }
    function prefetchMenus() {
      for(const row of weekIndex?.days || []) getMenu(row).catch(()=>{});
    }
    async function selectDay(row) {
      if($('report-sheet').open) $('report-sheet').close();
      const token=++loadToken;pendingDate=row.date;
      renderDays();$('plate').setAttribute('aria-busy','true');
      if(!data) empty('Getting the menu…','','tray');
      try {
        const payload=await getMenu(row);
        await warmArtwork(payload);
        if(token!==loadToken) return;
        selectedDate=row.date;pendingDate=undefined;plateIndex=0;selectedExtras.clear();brokenKeys=new Set();
        $('extras-wrap').open=false;
        data=payload;stale=data.date!==row.date;renderDays();dateLabel(row.date);render();
        $('plate').setAttribute('aria-busy','false');$('notice').textContent=(data.warnings || []).join(' ');
        const broken=await reports.broken(row.date);
        if(token===loadToken) {
          const previous=currentPlate();
          brokenKeys=new Set(broken);
          const next=previous?visiblePlates().findIndex(p=>p===previous):-1;
          if(next<0 && previous) {plateIndex=0;render();}
        }
      } catch(_) {
        if(token===loadToken) {
          pendingDate=undefined;renderDays();
          if(data) $('notice').textContent='That menu could not be loaded. Please try another day.';
          else empty('A little trouble in the kitchen.','Please choose another day or check the official menu below.','error');
        }
      } finally {if(token===loadToken) $('plate').setAttribute('aria-busy','false');}
    }
    async function loadToday() {
      const response=await fetch('./data/today.json',{cache:'no-store'});
      if(!response.ok) throw new Error('Menu request failed');
      data=validateDay(await response.json());
      const explicit=requested.get('date');
      const row={date:data.date,state:data.state};
      selectedDate=explicit || (defaultMenuDay({days:[row]}) || {date:berlinDate()}).date;
      stale=data.date!==selectedDate || (!explicit && !defaultMenuDay({days:[row]}));
      dateLabel(selectedDate);brokenKeys=new Set(await reports.broken(selectedDate));render();$('notice').textContent=(data.warnings || []).join(' ');
    }
    async function load() {
      try {
        const response=await fetch('./data/week.json',{cache:'no-store'});
        if(!response.ok) throw new Error('No week index');
        const index=await response.json();
        if(!MenuDays.validWeek(index,new Date(),requested.get('date'))) throw new Error('Stale week');
        index.days.sort((a,b)=>a.date.localeCompare(b.date));weekIndex=index;
        const explicit=requested.get('date');
        const day=/^\d{4}-\d{2}-\d{2}$/.test(explicit || '')
          ? index.days.find(row=>row.date===explicit) || {date:explicit,file:'data/days/'+explicit+'.json'}
          : defaultMenuDay(index);
        if(!day) throw new Error('No upcoming menu');
        await selectDay(day);prefetchMenus();
      } catch(_) {
        weekIndex=undefined;$('days').hidden=true;
        try {
          const explicit=requested.get('date');
          if(/^\d{4}-\d{2}-\d{2}$/.test(explicit || '')) await selectDay({date:explicit,file:'data/days/'+explicit+'.json'});
          else await loadToday();
        } catch(_) {data=undefined;empty('A little trouble in the kitchen.','Please reload in a moment, or check the official menu below.','error');}
      } finally {if(!weekIndex) $('plate').setAttribute('aria-busy','false');}
    }
    load();
  </script>
